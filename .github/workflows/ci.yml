name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/motorbridge-studio/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix plugins/motorbridge-studio/ui
      - run: npm run build
      - run: npm test
      - run: npm run typecheck --prefix plugins/motorbridge-studio/ui
      - run: npm run lint --prefix plugins/motorbridge-studio/ui
      - run: npm test --prefix plugins/motorbridge-studio/ui
